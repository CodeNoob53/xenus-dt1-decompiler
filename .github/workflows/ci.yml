name: CI

# Builds the app and runs the unit tests on every pull request (each push to a PR branch re-runs it).
# Branches without a PR are not built automatically; start the workflow by hand from the Actions tab
# if needed. Pushes to main come from merged PRs that have already passed this check.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build src/XenusDt1Decompiler/XenusDt1Decompiler.csproj -c Release

      - name: Test
        run: dotnet test tests/XenusDt1Decompiler.Tests -c Release --logger "console;verbosity=normal"
