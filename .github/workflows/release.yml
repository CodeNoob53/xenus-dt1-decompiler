name: Release

# A release is published when:
#   - a commit lands on main with a <Version> in the csproj that has no v<Version> tag yet
#     (the tag is created by the release itself), or
#   - a v* tag is pushed manually, or
#   - the workflow is started by hand with a tag.
# Release notes are taken from the "### v<Version>" section of README.md.
# If the RELEASE_REPO_TOKEN secret is set, the release is mirrored to RELEASE_REPO.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v3.0.0). Leave empty to use the csproj version."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CSPROJ: src/XenusDt1Decompiler/XenusDt1Decompiler.csproj
  RELEASE_REPO: CodeNoob53/xenus-dt1-decompiler-release-repo

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      HAS_MIRROR_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: vars
        shell: pwsh
        run: |
          $csprojVersion = ([xml](Get-Content $env:CSPROJ)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1

          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag }}") {
            $tag = "${{ inputs.tag }}"
          } else {
            if (-not $csprojVersion) { throw "No <Version> in $env:CSPROJ" }
            $tag = "v$csprojVersion"
          }

          $publish = $true
          if ("${{ github.ref_type }}" -ne "tag" -and (git tag --list $tag)) {
            Write-Host "Tag $tag already exists - nothing to release. Bump <Version> in $env:CSPROJ to publish."
            $publish = $false
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "tag=$tag publish=$publish"

      - name: Setup .NET
        if: steps.vars.outputs.publish == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set version
        if: steps.vars.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ver = "${{ steps.vars.outputs.version }}"
          $path = Resolve-Path $env:CSPROJ
          $xml = [xml](Get-Content $path)
          $pg = $xml.Project.PropertyGroup | Select-Object -First 1
          foreach ($node in @("Version", "AssemblyVersion", "FileVersion")) {
            if ($null -eq $pg.$node) { $pg.AppendChild($xml.CreateElement($node)) | Out-Null }
          }
          $pg.Version = $ver
          $pg.AssemblyVersion = "$ver.0"
          $pg.FileVersion = "$ver.0"
          $xml.Save($path)

      - name: Publish win-x64 (self-contained single file)
        if: steps.vars.outputs.publish == 'true'
        run: dotnet publish ${{ env.CSPROJ }} -c Release -r win-x64 -o .\publish

      - name: Download texconv
        if: steps.vars.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
          $rel = Invoke-RestMethod "https://api.github.com/repos/microsoft/DirectXTex/releases/latest" -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -eq "texconv.exe" } | Select-Object -First 1
          if (-not $asset) { throw "texconv.exe not found in DirectXTex $($rel.tag_name)" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ".\publish\texconv.exe"

      - name: Create package
        if: steps.vars.outputs.publish == 'true'
        id: package
        shell: pwsh
        run: |
          $tag = "${{ steps.vars.outputs.tag }}"
          $dirName = "xenus-dt1-decompiler-$tag"
          $artifact = "$dirName-win-x64.zip"

          Copy-Item ".\run_decompiler.bat" -Destination ".\publish\"
          Copy-Item ".\dist\README.txt" -Destination ".\publish\"

          # Named subfolder so the zip extracts cleanly
          New-Item -ItemType Directory -Path ".\pkg\$dirName" | Out-Null
          Copy-Item ".\publish\*" -Destination ".\pkg\$dirName\" -Recurse -Exclude "*.pdb"

          Compress-Archive -Path ".\pkg\$dirName" -DestinationPath $artifact -Force
          "artifact=$artifact" >> $env:GITHUB_OUTPUT

      - name: Extract release notes
        if: steps.vars.outputs.publish == 'true'
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ steps.vars.outputs.tag }}"
          $lines = Get-Content README.md -Encoding utf8
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l.Trim() -eq "### $tag" })
          $notes = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Length; $i++) {
              if ($lines[$i] -match '^(#{1,3}) ' -or $lines[$i] -eq '---') { break }
              $notes += $lines[$i]
            }
          }
          $text = ($notes -join "`n").Trim()
          if (-not $text) {
            Write-Host "::warning::No '### $tag' section in README.md changelog - using generated notes only."
          }
          [IO.File]::WriteAllText("release-notes.md", $text + "`n", [Text.UTF8Encoding]::new($false))

      - name: Create GitHub release
        if: steps.vars.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          generate_release_notes: true
          files: ${{ steps.package.outputs.artifact }}

      - name: Mirror release to release repo
        if: steps.vars.outputs.publish == 'true' && env.HAS_MIRROR_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          body_path: release-notes.md
          files: ${{ steps.package.outputs.artifact }}

      - name: Note about mirroring
        if: steps.vars.outputs.publish == 'true' && env.HAS_MIRROR_TOKEN != 'true'
        run: echo "::notice::RELEASE_REPO_TOKEN is not set - release was not mirrored to ${{ env.RELEASE_REPO }}."
